services:
  db:
    image: postgres:17
    hostname: ${DB_HOST}
    ports:
      - "5432:${DB_PORT}"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  inngest:
    image: inngest/inngest:latest
    network_mode: host
    environment:
      - INNGEST_DEV=1
    command:
      - /usr/bin/inngest
      - dev
      - --host
      - 0.0.0.0
      - -u
      - http://127.0.0.1:3000/api/inngest
    volumes:
      - inngest_data:/var/lib/inngest
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  minio_data:
  inngest_data:
