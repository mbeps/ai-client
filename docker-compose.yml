services:
  db:
    image: postgres:17
    hostname: ${DB_HOST}
    ports:
      - "5432:${DB_PORT}"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ADDRESS=[::]:9000
      - RUSTFS_CONSOLE_ADDRESS=[::]:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY}
      - RUSTFS_VOLUMES=/data
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

  inngest:
    image: inngest/inngest:v1.45.1
    network_mode: host
    environment:
      - INNGEST_DEV=1
    command:
      - /usr/bin/inngest
      - dev
      - --host
      - 0.0.0.0
      - -u
      - http://127.0.0.1:3000/api/inngest
    volumes:
      - inngest_data:/var/lib/inngest
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  rustfs_data:
  inngest_data:
